[package]
name = "fence-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
fence-core = { path = "../crates/fence-core" }
libfuzzer-sys = "0.4.10"

[[bin]]
name = "manifest_decode"
path = "fuzz_targets/manifest_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "native_path_decode"
path = "fuzz_targets/native_path_decode.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
