name: Recover alpha.2 npm publication

on:
  workflow_dispatch:

run-name: Recover npm v0.1.0-alpha.2

concurrency:
  group: recover-npm-v0.1.0-alpha.2
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: v0.1.0-alpha.2
  RELEASE_VERSION: 0.1.0-alpha.2
  RELEASE_COMMIT: bfab04dee14a57e166301b4ca8984e6311e9d9b9

jobs:
  publish-platforms:
    name: Verify alpha.2 and publish npm platform packages
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: v0.1.0-alpha.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Verify immutable release source and draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_COMMIT}"
          GITHUB_REF_NAME="${RELEASE_TAG}" node scripts/check-release-version.mjs

          tag_object="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object'
          )"
          test "$(jq -r .type <<<"${tag_object}")" = tag
          tag_sha="$(jq -r .sha <<<"${tag_object}")"
          tag="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")"
          test "$(jq -r .object.sha <<<"${tag}")" = "${RELEASE_COMMIT}"
          test "$(jq -r .verification.verified <<<"${tag}")" = true

          release="$(gh release view "${RELEASE_TAG}" --json isDraft,isPrerelease,tagName)"
          test "$(jq -r .tagName <<<"${release}")" = "${RELEASE_TAG}"
          test "$(jq -r .isDraft <<<"${release}")" = true
          test "$(jq -r .isPrerelease <<<"${release}")" = true
      - name: Download and verify existing release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          for asset in \
            "fence-${RELEASE_VERSION}-x86_64-unknown-linux-gnu" \
            "fence-${RELEASE_VERSION}-x86_64-apple-darwin" \
            "fence-${RELEASE_VERSION}-aarch64-apple-darwin" \
            "fence-${RELEASE_VERSION}-SHA256SUMS" \
            THIRD_PARTY_LICENSES
          do
            gh release download "${RELEASE_TAG}" \
              --pattern "${asset}" --dir release-assets
          done

          test "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" = 5
          (
            cd release-assets
            sha256sum --check --ignore-missing \
              "fence-${RELEASE_VERSION}-SHA256SUMS"
          )
          for asset in \
            release-assets/THIRD_PARTY_LICENSES \
            release-assets/fence-"${RELEASE_VERSION}"-SHA256SUMS \
            release-assets/fence-"${RELEASE_VERSION}"-x86_64-unknown-linux-gnu \
            release-assets/fence-"${RELEASE_VERSION}"-x86_64-apple-darwin \
            release-assets/fence-"${RELEASE_VERSION}"-aarch64-apple-darwin
          do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}"
          done
      - name: Stage and pack exact npm packages
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          node scripts/stage-npm-packages.mjs \
            release-assets \
            release-assets/THIRD_PARTY_LICENSES \
            npm-staged
          mkdir npm-tarballs
          for package in \
            npm-staged/linux-x64-gnu \
            npm-staged/darwin-x64 \
            npm-staged/darwin-arm64 \
            npm-staged/fence-cli
          do
            npm pack "./${package}" --pack-destination npm-tarballs --json |
              tee -a npm-tarballs/pack-results.jsonl
          done
          test "$(find npm-tarballs -maxdepth 1 -name '*.tgz' | wc -l | tr -d ' ')" = 4
      - name: Attest exact npm tarballs
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: npm-tarballs/*.tgz
      - name: Publish platform tarballs or verify existing integrity
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          publish_package() {
            tarball="$1"
            manifest="$(tar -xOzf "${tarball}" package/package.json)"
            name="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).name)' "${manifest}")"
            version="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "${manifest}")"
            test "${version}" = "${RELEASE_VERSION}"
            integrity="$(node -e '
              const crypto = require("node:crypto");
              const fs = require("node:fs");
              const digest = crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64");
              process.stdout.write(`sha512-${digest}`);
            ' "${tarball}")"
            if remote="$(npm view "${name}@${version}" dist.integrity --json 2>/dev/null)"; then
              test "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "${remote}")" = "${integrity}"
              echo "${name}@${version} already exists with identical integrity"
              return
            fi

            npm publish "${PWD}/${tarball}" --tag alpha --access public --provenance
            for attempt in $(seq 1 60); do
              if remote="$(npm view "${name}@${version}" dist.integrity --json 2>/dev/null)"; then
                test "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "${remote}")" = "${integrity}"
                return
              fi
              test "${attempt}" -lt 60
              sleep 5
            done
          }
          publish_package "npm-tarballs/22elix3r-fence-linux-x64-gnu-${RELEASE_VERSION}.tgz"
          publish_package "npm-tarballs/22elix3r-fence-darwin-x64-${RELEASE_VERSION}.tgz"
          publish_package "npm-tarballs/22elix3r-fence-darwin-arm64-${RELEASE_VERSION}.tgz"
      - name: Upload exact tarballs for smoke and final publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovered-alpha2-npm-tarballs
          path: npm-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Attach exact npm tarballs to draft prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir existing-npm-assets
          gh release download "${RELEASE_TAG}" --pattern '*.tgz' \
            --dir existing-npm-assets >/dev/null 2>&1 || true
          for asset in npm-tarballs/*.tgz; do
            name="$(basename "${asset}")"
            if test -e "existing-npm-assets/${name}"; then
              cmp "${asset}" "existing-npm-assets/${name}"
            else
              gh release upload "${RELEASE_TAG}" "${asset}"
            fi
          done

  smoke:
    name: npm alpha.2 smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: publish-platforms
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-15]
        node: ["22.15.0", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v0.1.0-alpha.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovered-alpha2-npm-tarballs
          path: npm-tarballs
      - name: Install exact CLI tarball and exercise installed command
        shell: bash
        run: |
          set -euo pipefail
          export NPM_CONFIG_PREFIX="${RUNNER_TEMP}/fence-npm-prefix"
          npm install --global --ignore-scripts --include=optional \
            "${GITHUB_WORKSPACE}/npm-tarballs/fence-cli-${RELEASE_VERSION}.tgz"
          platform_package_count="$(
            npm ls --global --all --parseable |
              grep -c '/node_modules/@22elix3r/fence-'
          )"
          test "${platform_package_count}" = 1
          PATH="${NPM_CONFIG_PREFIX}/bin:${PATH}" fence --version |
            grep -F "${RELEASE_VERSION}"
          smoke_wrapper="${RUNNER_TEMP}/fence-npm-smoke"
          printf '%s\n' \
            '#!/bin/sh' \
            'exec "$FENCE_SMOKE_NODE" "$FENCE_SMOKE_LAUNCHER" "$@"' \
            > "${smoke_wrapper}"
          chmod +x "${smoke_wrapper}"
          FENCE_SMOKE_NODE="$(command -v node)" \
            FENCE_SMOKE_LAUNCHER="$(npm root --global)/fence-cli/bin/fence.js" \
            scripts/release-smoke.sh "${smoke_wrapper}"
      - name: Verify public-registry signatures and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir npm-signature-audit
          cd npm-signature-audit
          npm init --yes >/dev/null
          npm install --ignore-scripts --include=optional \
            "${GITHUB_WORKSPACE}/npm-tarballs/fence-cli-${RELEASE_VERSION}.tgz"
          npm audit signatures

  finalize:
    name: Publish npm CLI and expose alpha.2 prerelease
    needs: smoke
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v0.1.0-alpha.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovered-alpha2-npm-tarballs
          path: npm-tarballs
      - name: Publish exact CLI tarball or verify existing integrity
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          tarball="npm-tarballs/fence-cli-${RELEASE_VERSION}.tgz"
          integrity="$(node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const digest = crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64");
            process.stdout.write(`sha512-${digest}`);
          ' "${tarball}")"
          if remote="$(npm view "fence-cli@${RELEASE_VERSION}" dist.integrity --json 2>/dev/null)"; then
            test "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "${remote}")" = "${integrity}"
            test "$(npm view fence-cli dist-tags.latest)" = "${RELEASE_VERSION}"
          else
            npm publish "${PWD}/${tarball}" --tag latest --access public --provenance
            for attempt in $(seq 1 60); do
              if remote="$(npm view "fence-cli@${RELEASE_VERSION}" dist.integrity --json 2>/dev/null)"; then
                test "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "${remote}")" = "${integrity}"
                test "$(npm view fence-cli dist-tags.latest)" = "${RELEASE_VERSION}"
                break
              fi
              test "${attempt}" -lt 60
              sleep 5
            done
          fi
      - name: Publish existing GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" --draft=false --prerelease
