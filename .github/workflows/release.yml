name: Unix alpha release

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.1.0-alpha.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Verify tag and package version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "anchor-cli") | .version')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$(grep -c "^## \\[${version}\\]" CHANGELOG.md)" = "1"
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}" -p anchor-cli
      - name: Exercise release binary without git
        shell: bash
        run: scripts/release-smoke.sh "target/${{ matrix.target }}/release/anchor"
      - name: Package release
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package="anchor-${GITHUB_REF_NAME#v}-${TARGET}"
          mkdir -p "dist/${package}/docs"
          cp "target/${TARGET}/release/anchor" "dist/${package}/anchor"
          cp README.md LICENSE-APACHE LICENSE-MIT CHANGELOG.md "dist/${package}/"
          cp docs/safety.md docs/storage.md docs/configuration.md \
            "dist/${package}/docs/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${package}.tar.gz" > "${package}.tar.gz.sha256")
          fi
      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: dist/*.tar.gz
      - name: Upload immutable build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish prerelease
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Verify release checksums
        run: |
          cd release-assets
          sha256sum --check *.sha256
      - name: Publish experimental Unix alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --prerelease \
            --verify-tag \
            --title "Anchor ${GITHUB_REF_NAME#v}" \
            --notes-file <(awk \
              "/^## \\[${GITHUB_REF_NAME#v}\\]/{emit=1; next} \
               /^## \\[/{if (emit) exit} emit" CHANGELOG.md)
