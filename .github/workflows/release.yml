name: Public alpha release

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.1.0-alpha.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_RUST: "1.97.1"

jobs:
  gate:
    name: Verify release source
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - name: Verify versions and package policy
        run: |
          node scripts/check-release-version.mjs
          node --test npm/fence-cli/test/*.test.js
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Require a signed tag on the exact successful main commit
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

          tag_object="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" \
              --jq '.object'
          )"
          test "$(jq -r .type <<<"${tag_object}")" = tag
          tag_sha="$(jq -r .sha <<<"${tag_object}")"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" \
            --jq '.verification.verified' | grep -x true

          runs="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow ci.yml \
              --commit "${GITHUB_SHA}" \
              --event push \
              --limit 20 \
              --json conclusion,headSha
          )"
          jq -e --arg sha "${GITHUB_SHA}" \
            'any(.[]; .headSha == $sha and .conclusion == "success")' \
            <<<"${runs}" >/dev/null

  build:
    name: Build ${{ matrix.target }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RELEASE_RUST }}
          targets: ${{ matrix.target }}
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}" -p fence-cli
      - name: Exercise release binary outside Git metadata
        shell: bash
        run: scripts/release-smoke.sh "target/${{ matrix.target }}/release/fence"
      - name: Stage raw binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "fence-cli") | .version')"
          mkdir -p dist
          cp "target/${TARGET}/release/fence" "dist/fence-${version}-${TARGET}"
      - name: Attest raw binary
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/fence-*
      - name: Upload raw binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: dist/fence-*
          if-no-files-found: error

  metadata:
    name: Generate notices and SBOMs
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - name: Install pinned release metadata tools
        run: |
          cargo install cargo-about --version 0.9.1 --locked --features cli
          cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate notices and target SBOMs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cargo about generate about.hbs > dist/THIRD_PARTY_LICENSES
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            cargo cyclonedx \
              --format json \
              --target "${target}" \
              --target-in-filename \
              --override-filename fence-cli \
              --manifest-path crates/fence-cli/Cargo.toml
            mv "crates/fence-cli/fence-cli_${target}.cdx.json" \
              "dist/fence-${target}.cdx.json"
            find crates -name "fence-cli_${target}.cdx.json" -delete
          done
      - name: Attest notices and SBOMs
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/THIRD_PARTY_LICENSES
            dist/*.cdx.json
      - name: Upload metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: dist/*
          if-no-files-found: error

  package:
    name: Assemble deterministic release archives
    needs: [build, metadata]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: inputs
          pattern: binary-*
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: inputs
          name: release-metadata
          merge-multiple: true
      - name: Assemble archives and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "fence-cli") | .version')"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          mkdir -p dist
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            package="fence-${version}-${target}"
            mkdir -p "stage/${package}/docs"
            cp "inputs/fence-${version}-${target}" "stage/${package}/fence"
            chmod 0755 "stage/${package}/fence"
            cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE \
              "inputs/THIRD_PARTY_LICENSES" "stage/${package}/"
            cp docs/installation.md docs/quickstart.md docs/recovery.md \
              docs/safety.md docs/storage.md docs/configuration.md \
              docs/security-model.md docs/troubleshooting.md docs/platforms.md \
              docs/migration-from-anchor.md docs/json-api.md \
              "stage/${package}/docs/"
            cp "inputs/fence-${target}.cdx.json" \
              "stage/${package}/${package}.cdx.json"
            tar --sort=name --mtime="@${source_date_epoch}" \
              --owner=0 --group=0 --numeric-owner \
              -C stage -czf "dist/${package}.tar.gz" "${package}"
            cp "inputs/fence-${version}-${target}" dist/
            cp "inputs/fence-${target}.cdx.json" \
              "dist/${package}.cdx.json"
          done
          cp inputs/THIRD_PARTY_LICENSES dist/
          (cd dist && sha256sum * > "fence-${version}-SHA256SUMS")
      - name: Verify archive paths and checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check fence-*-SHA256SUMS)
          for archive in dist/*.tar.gz; do
            tar -tzf "${archive}" | awk '
              /^\// || /(^|\/)\.\.($|\/)/ { bad = 1 }
              END { exit bad }
            '
          done
      - name: Attest release bundle
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*SHA256SUMS
            dist/fence-0.1.0-alpha.*-x86_64-*
            dist/fence-0.1.0-alpha.*-aarch64-*
            dist/*.cdx.json
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error

  linux-compatibility:
    name: Linux artifact smoke (${{ matrix.name }})
    needs: package
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            image: ubuntu:22.04@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
          - name: Ubuntu 24.04
            image: ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90
          - name: Fedora 43
            image: fedora:43@sha256:762d73ba1c455232b0272c5d445a34f36c4b9f421cbc05ce8102552325b6a222
          - name: Arch
            image: archlinux:base-20260719.0.558177@sha256:592e11bd99ab579f933a0cb77a8f66e2f3ae57f5eafacf13aea44a6e98ef21ae
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          name: release-bundle
      - name: Exercise released Linux bytes
        shell: sh
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          binary="release-assets/fence-${version}-x86_64-unknown-linux-gnu"
          chmod 0755 "${binary}"
          scripts/release-smoke.sh "${binary}"

  draft-release:
    name: Create draft GitHub prerelease
    if: github.event_name == 'push'
    needs: [package, linux-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          name: release-bundle
      - name: Create immutable draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --json isDraft \
            --jq .isDraft >/tmp/fence-release-is-draft 2>/dev/null
          then
            grep -x true /tmp/fence-release-is-draft
            mkdir existing-assets
            gh release download "${GITHUB_REF_NAME}" \
              --dir existing-assets >/dev/null 2>&1 || true
            for asset in release-assets/*; do
              name="$(basename "${asset}")"
              if test -e "existing-assets/${name}"; then
                cmp "${asset}" "existing-assets/${name}"
              else
                gh release upload "${GITHUB_REF_NAME}" "${asset}"
              fi
            done
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --draft \
              --prerelease \
              --verify-tag \
              --title "Fence ${GITHUB_REF_NAME#v}" \
              --notes-file <(awk \
                "/^## \\[${GITHUB_REF_NAME#v}\\]/{emit=1; next} \
                 /^## \\[/{if (emit) exit} emit" CHANGELOG.md)
          fi

  publish-crates:
    name: Publish crates.io packages
    if: github.event_name == 'push'
    needs: draft-release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RELEASE_RUST }}
      - name: Request crates.io trusted-publishing token
        id: crates-auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token || secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: scripts/publish-crates.sh
      - name: Yank the incomplete alpha.1 leaf after successful replacement
        if: github.ref_name == 'v0.1.0-alpha.2'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version_url="https://crates.io/api/v1/crates/fence-unix/0.1.0-alpha.1"
          if curl --fail --silent --show-error \
            --user-agent 'Fence release recovery (+https://github.com/22elix3r/fence)' \
            "${version_url}" | jq --exit-status '.version.yanked == true' >/dev/null
          then
            echo "fence-unix 0.1.0-alpha.1 is already yanked"
          else
            cargo yank --version 0.1.0-alpha.1 fence-unix
          fi

  publish-npm:
    name: Publish npm packages under alpha
    if: github.event_name == 'push'
    needs: publish-crates
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          name: release-bundle
      - name: Stage and pack npm packages
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          node scripts/stage-npm-packages.mjs \
            release-assets \
            release-assets/THIRD_PARTY_LICENSES \
            npm-staged
          mkdir npm-tarballs
          for package in \
            npm-staged/linux-x64-gnu \
            npm-staged/darwin-x64 \
            npm-staged/darwin-arm64 \
            npm-staged/fence-cli
          do
            npm pack "./${package}" --pack-destination npm-tarballs --json |
              tee -a npm-tarballs/pack-results.jsonl
          done
      - name: Attest npm tarballs
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: npm-tarballs/*.tgz
      - name: Publish exact platform tarballs or verify existing bytes
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          publish_package() {
            tarball="$1"
            manifest="$(tar -xOzf "${tarball}" package/package.json)"
            name="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).name)' "${manifest}")"
            version="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "${manifest}")"
            integrity="$(node -e '
              const crypto = require("node:crypto");
              const fs = require("node:fs");
              const digest = crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64");
              process.stdout.write(`sha512-${digest}`);
            ' "${tarball}")"
            if remote="$(npm view "${name}@${version}" dist.integrity --json 2>/dev/null)"; then
              test "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "${remote}")" = "${integrity}"
              echo "${name}@${version} already exists with identical integrity"
            else
              npm publish "${PWD}/${tarball}" --tag alpha --access public --provenance
              for attempt in $(seq 1 60); do
                npm view "${name}@${version}" version >/dev/null 2>&1 && break
                test "${attempt}" -lt 60
                sleep 5
              done
            fi
          }
          version="$(node -p "require('./npm/fence-cli/package.json').version")"
          publish_package "npm-tarballs/22elix3r-fence-linux-x64-gnu-${version}.tgz"
          publish_package "npm-tarballs/22elix3r-fence-darwin-x64-${version}.tgz"
          publish_package "npm-tarballs/22elix3r-fence-darwin-arm64-${version}.tgz"
      - name: Upload exact npm tarballs for smoke and final publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarballs
          path: npm-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Attach npm tarballs to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir existing-npm-assets
          gh release download "${GITHUB_REF_NAME}" --pattern '*.tgz' \
            --dir existing-npm-assets >/dev/null 2>&1 || true
          for asset in npm-tarballs/*.tgz; do
            name="$(basename "${asset}")"
            if test -e "existing-npm-assets/${name}"; then
              cmp "${asset}" "existing-npm-assets/${name}"
            else
              gh release upload "${GITHUB_REF_NAME}" "${asset}"
            fi
          done

  npm-smoke:
    name: npm registry smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    if: github.event_name == 'push'
    needs: publish-npm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, macos-15]
        node: ["22.15.0", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: npm-tarballs
      - name: Install the exact CLI tarball and exercise the installed command
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./npm/fence-cli/package.json').version")"
          export NPM_CONFIG_PREFIX="${RUNNER_TEMP}/fence-npm-prefix"
          npm install --global --ignore-scripts --include=optional \
            "${GITHUB_WORKSPACE}/npm-tarballs/fence-cli-${version}.tgz"
          platform_package_count="$(
            npm ls --global --all --parseable |
              grep -c '/node_modules/@22elix3r/fence-'
          )"
          test "${platform_package_count}" = 1
          PATH="${NPM_CONFIG_PREFIX}/bin:${PATH}" fence --version | grep -F "${version}"
          smoke_wrapper="${RUNNER_TEMP}/fence-npm-smoke"
          printf '%s\n' \
            '#!/bin/sh' \
            'exec "$FENCE_SMOKE_NODE" "$FENCE_SMOKE_LAUNCHER" "$@"' \
            > "${smoke_wrapper}"
          chmod +x "${smoke_wrapper}"
          FENCE_SMOKE_NODE="$(command -v node)" \
            FENCE_SMOKE_LAUNCHER="$(npm root --global)/fence-cli/bin/fence.js" \
            scripts/release-smoke.sh "${smoke_wrapper}"
      - name: Verify public-registry signatures and provenance
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./npm/fence-cli/package.json').version")"
          mkdir npm-signature-audit
          cd npm-signature-audit
          npm init --yes >/dev/null
          npm install --ignore-scripts --include=optional \
            "${GITHUB_WORKSPACE}/npm-tarballs/fence-cli-${version}.tgz"
          npm audit signatures

  finalize:
    name: Publish npm CLI and GitHub prerelease
    if: github.event_name == 'push'
    needs: npm-smoke
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: npm-tarballs
      - name: Publish the verified npm CLI as latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.5.1
          version="$(node -p "require('./npm/fence-cli/package.json').version")"
          tarball="npm-tarballs/fence-cli-${version}.tgz"
          integrity="$(node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const digest = crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64");
            process.stdout.write(`sha512-${digest}`);
          ' "${tarball}")"
          if remote="$(npm view "fence-cli@${version}" dist.integrity --json 2>/dev/null)"; then
            test "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "${remote}")" = "${integrity}"
            test "$(npm view fence-cli dist-tags.latest)" = "${version}"
            echo "fence-cli@${version} already exists with identical integrity and is latest"
          else
            npm publish "${PWD}/${tarball}" --tag latest --access public --provenance
          fi
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease
