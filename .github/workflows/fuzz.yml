name: Fuzz smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  parsers:
    name: Parser fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-fuzz
      - name: Run bounded fuzz targets
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            manifest_decode \
            native_path_decode \
            session_decode \
            frozen_policy_decode \
            restore_plan_decode \
            journal_decode \
            object_envelope_decode \
            restore_plan_calculate \
            diff_render
          do
            cargo fuzz run "$target" --target x86_64-unknown-linux-gnu -- \
              -max_total_time=20
          done
