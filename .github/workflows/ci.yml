name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo test --workspace --locked
      - name: Build native platform documentation
        if: runner.os == 'macOS'
        run: RUSTDOCFLAGS="-D warnings" cargo doc -p fence-unix --no-deps --locked
      - name: Build native platform documentation
        if: runner.os == 'Windows'
        run: cargo doc -p fence-windows --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  quality:
    name: Formatting, Clippy, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  windows-quality:
    name: Windows Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.85
      - run: cargo test --workspace --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  packaging:
    name: Package preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Validate release metadata and launcher
        run: |
          npm ci --prefix npm --ignore-scripts
          node scripts/check-release-version.mjs
          node --test npm/fence-cli/test/*.test.js
      - name: Inspect Cargo source packages
        shell: bash
        run: |
          set -euo pipefail
          for crate in \
            fence-unix fence-windows fence-core fence-git \
            fence-session fence-tui fence-cli
          do
            cargo package --list --locked -p "${crate}" > "${RUNNER_TEMP}/${crate}.files"
            grep -x README.md "${RUNNER_TEMP}/${crate}.files"
            if grep -E '(^|/)(target|\.git|npm-staged)(/|$)' "${RUNNER_TEMP}/${crate}.files"; then
              echo "unexpected generated path in ${crate} package" >&2
              exit 1
            fi
          done
      - name: Assemble and inspect npm tarballs with fixture bytes
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p fence-cli
          mkdir package-fixtures
          version="$(node -p "require('./npm/fence-cli/package.json').version")"
          for target in \
            x86_64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            cp target/debug/fence "package-fixtures/fence-${version}-${target}"
          done
          printf 'CI packaging fixture; release notices are generated by cargo-about.\n' \
            > package-fixtures/THIRD_PARTY_LICENSES
          node scripts/stage-npm-packages.mjs \
            package-fixtures package-fixtures/THIRD_PARTY_LICENSES npm-staged
          mkdir npm-tarballs
          for package in npm-staged/*; do
            npm pack "./${package}" --pack-destination npm-tarballs --json >/dev/null
          done
          test "$(find npm-tarballs -type f -name '*.tgz' | wc -l)" -eq 4
          for tarball in npm-tarballs/*.tgz; do
            tar -tzf "${tarball}" | awk '
              /^package\/(package.json|README.md|LICENSE-MIT|LICENSE-APACHE|THIRD_PARTY_LICENSES|integrity.json|bin\/fence|bin\/fence.js)$/ { next }
              { print "unexpected npm path: " $0; bad = 1 }
              END { exit bad }
            '
          done
