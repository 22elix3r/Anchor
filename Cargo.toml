[workspace]
members = [
    "crates/anchor-windows",
    "crates/anchor-core",
    "crates/anchor-git",
    "crates/anchor-session",
    "crates/anchor-cli",
    "crates/anchor-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/22elix3r/Anchor"
homepage = "https://github.com/22elix3r/Anchor"
authors = ["Anchor contributors"]

[workspace.dependencies]
anchor-windows = { version = "0.1.0-alpha.1", path = "crates/anchor-windows" }
anchor-core = { version = "0.1.0-alpha.1", path = "crates/anchor-core" }
anchor-git = { version = "0.1.0-alpha.1", path = "crates/anchor-git" }
anchor-session = { version = "0.1.0-alpha.1", path = "crates/anchor-session" }
anchor-tui = { version = "0.1.0-alpha.1", path = "crates/anchor-tui" }

base64 = "0.23.0"
atomic-write-file = "0.3.0"
blake3 = { version = "1.8.5", default-features = false, features = ["pure"] }
cap-std = "4.0.2"
ciborium = "0.2.2"
clap = { version = "4.6.4", features = ["derive"] }
command-fds = "0.3.3"
crossterm = "0.28.1"
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
gix = { version = "0.86.0", default-features = false, features = ["excludes", "index", "sha1", "sha256"] }
imara-diff = { package = "gix-imara-diff", version = "0.2.4", features = ["unified_diff"] }
miette = { version = "7.6.0", features = ["fancy-no-backtrace"] }
proptest = "1.11.0"
ratatui = { version = "0.29.0", default-features = false, features = ["crossterm"] }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
signal-hook = "0.4.4"
tempfile = "3.27.0"
thiserror = "2.0.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }
zstd = { version = "0.13.3", default-features = false }
windows-sys = { version = "0.61.2", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
